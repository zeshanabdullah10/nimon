<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>NIMon Dashboard</title>
  <!-- No external requests: system fonts only (works on air-gapped test networks). -->
  <script>
    // Resolve the theme before first paint (no flash). Mirrors hooks/nimon.ts.
    (function () {
      try {
        var p = localStorage.getItem('nimon.theme') || 'system';
        var t = p === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : p;
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
