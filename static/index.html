<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>NIMon Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=bolt,check,developer_board,device_thermostat,error,grid_view,hub,insights,lan,memory,monitoring,notifications,sync,warning&display=block" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <header class="app-bar">
        <div class="app-bar-inner">
            <div class="brand">
                <div class="brand-icon" aria-hidden="true">
                    <span class="ms ms-fill ms-24">hub</span>
                </div>
                <div class="brand-text">
                    <span class="brand-title">NIMon</span>
                    <span class="brand-sub">Hardware Monitoring · v0.1.0</span>
                </div>
            </div>
            <div class="app-bar-actions">
                <div class="pill" id="sysStatus" role="status">
                    <span class="pill-dot"></span>
                    <span id="sysStatusText">Checking…</span>
                </div>
                <div class="pill pill-quiet" id="syncPill" role="status">
                    <span class="ms ms-16">sync</span>
                    <span id="syncText">Syncing…</span>
                </div>
            </div>
        </div>
    </header>

    <main class="container">

        <!-- Summary -->
        <section class="stat-grid" aria-label="System summary">
            <div class="stat-card">
                <div class="stat-icon tonal-primary">
                    <span class="ms ms-fill ms-22">lan</span>
                </div>
                <div class="stat-body">
                    <span class="stat-label">Edge Nodes</span>
                    <span class="stat-value" id="statEdges">—</span>
                    <span class="stat-sub" id="statEdgesSub"></span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon tonal-secondary">
                    <span class="ms ms-fill ms-22">memory</span>
                </div>
                <div class="stat-body">
                    <span class="stat-label">Devices Online</span>
                    <span class="stat-value" id="statDevices">—</span>
                    <span class="stat-sub" id="statDevicesSub"></span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon tonal-error" id="statAlertsIcon">
                    <span class="ms ms-fill ms-22">warning</span>
                </div>
                <div class="stat-body">
                    <span class="stat-label">Active Alerts</span>
                    <span class="stat-value" id="statAlerts">—</span>
                    <span class="stat-sub" id="statAlertsSub"></span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon tonal-tertiary">
                    <span class="ms ms-fill ms-22">monitoring</span>
                </div>
                <div class="stat-body">
                    <span class="stat-label">Predictions</span>
                    <span class="stat-value" id="statPreds">—</span>
                    <span class="stat-sub">confidence ≥ 80%</span>
                </div>
            </div>
        </section>

        <!-- Edge filter -->
        <nav class="chip-row" id="chipRow" aria-label="Filter by edge node"></nav>

        <!-- Content -->
        <div class="layout">

            <section class="panel">
                <div class="panel-head">
                    <h2><span class="ms ms-20 panel-icon">grid_view</span>Devices</h2>
                    <span class="panel-badge" id="devicesCount"></span>
                </div>
                <div class="panel-body" id="devicesList"></div>
            </section>

            <aside class="side">
                <section class="panel">
                    <div class="panel-head">
                        <h2><span class="ms ms-20 panel-icon">notifications</span>Alerts</h2>
                        <span class="panel-badge" id="alertsCount"></span>
                    </div>
                    <div class="panel-body list" id="alertsList"></div>
                </section>
                <section class="panel">
                    <div class="panel-head">
                        <h2><span class="ms ms-20 panel-icon">insights</span>Predictions</h2>
                        <span class="panel-badge" id="predsCount"></span>
                    </div>
                    <div class="panel-body list" id="predsList"></div>
                </section>
            </aside>

        </div>
    </main>

    <script src="/app.js"></script>
</body>
</html>
