[workspace]
resolver = "2"
members = [
    "crates/nimon-core",
    "crates/nimon-edge",
    "crates/nimon-hub",
    "crates/nimon-cli",
    "crates/nimon-ni",
    "crates/nimon-sim",
    "crates/nimon-widget",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["NIMon Team"]
license = "MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
actix = "0.13"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
libloading = "0.8"
async-trait = "0.1"

# Optimized release builds: cross-crate inlining + smaller binaries
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
