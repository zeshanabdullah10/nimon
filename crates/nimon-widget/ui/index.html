<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>NIMon Widget</title>
<style>
/* ═══ tokens ═════════════════════════════════════════════════════════ */
:root {
    --bg-panel: #101010;
    --bg-card: rgba(255, 255, 255, 0.045);
    --text-1: #ffffff;
    --text-2: rgba(255, 255, 255, 0.55);
    --text-3: rgba(255, 255, 255, 0.33);
    --divider: rgba(255, 255, 255, 0.08);
    --panel-border: rgba(255, 255, 255, 0.09);

    --ok: #30d158;
    --warn: #ffd60a;
    --crit: #ff453a;
    --idle: rgba(255, 255, 255, 0.45);

    --fill-ok: linear-gradient(90deg, rgba(48, 209, 88, 0.30) 0%, rgba(48, 209, 88, 0.06) 100%);
    --fill-warn: linear-gradient(90deg, rgba(255, 214, 10, 0.30) 0%, rgba(255, 214, 10, 0.06) 100%);
    --fill-crit: linear-gradient(90deg, rgba(255, 69, 58, 0.32) 0%, rgba(255, 69, 58, 0.07) 100%);

    --font: 'Segoe UI Variable Display', 'Segoe UI Variable Text', 'Inter',
            'Segoe UI', system-ui, sans-serif;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.4);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
    height: 100%;
    overflow: hidden;
    background: transparent;
}
body {
    font-family: var(--font);
    font-size: 13px;
    color: var(--text-1);
    display: flex;
    flex-direction: row;
    font-variant-numeric: tabular-nums;
    user-select: none;
    cursor: default;
}

#panelArea { flex: 1; position: relative; min-width: 0; }
#strip {
    width: 60px;
    flex-shrink: 0;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 6px;
}

/* ═══ notch bar (the visible strip) ══════════════════════════════════ */

#bar {
    width: 48px;
    background: var(--bg-panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 8px 0 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    cursor: grab;
    touch-action: none;
}
#bar.dragging { cursor: grabbing; }
#bar.locked { cursor: default; }
#bar.locked.dragging { cursor: default; }

#tiles {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
    width: 100%;
}

.bar-sep {
    width: 22px;
    height: 1px;
    background: var(--divider);
    margin: 1px 0;
}

.lockbtn {
    width: 26px;
    height: 22px;
    display: grid;
    place-items: center;
    color: var(--text-3);
    border-radius: 7px;
    cursor: pointer;
}
.lockbtn:hover { color: var(--text-1); background: rgba(255, 255, 255, 0.06); }
#bar.locked .lockbtn { color: var(--warn); }

/* ═══ chassis tiles ══════════════════════════════════════════════════ */

.tile {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: default;
}
.tile .box { position: relative; width: 40px; height: 40px; }
.tile svg.ring { position: absolute; inset: 0; }
.tile .glyph {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    color: var(--text-1);
}
.tile .glyph.txt {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.2px;
}
.tile .pct {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-2);
    line-height: 1;
    font-variant-numeric: tabular-nums;
}
.tile.hub .glyph { color: var(--warn); }
.ring-prog { transition: stroke-dashoffset .5s ease-out; }

/* ═══ main panel ═════════════════════════════════════════════════════ */

#panel {
    position: absolute;
    right: 10px;
    top: 24px;
    width: 380px;
    max-height: calc(100% - 16px);
    overflow: hidden;
    background: var(--bg-panel);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 14px;
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateX(6px);
    transition: opacity .16s ease, transform .16s ease;
    pointer-events: none;
    display: flex;
    flex-direction: column;
}
body.expanded #panel { opacity: 1; transform: none; pointer-events: auto; }

#panel > * { flex: none; }
#panel .cards { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
#panel .cards::-webkit-scrollbar { width: 5px; }
#panel .cards::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.14);
    border-radius: 3px;
}

#panel::after {
    content: '';
    position: absolute;
    right: -5.5px;
    top: var(--notch-y, 60px);
    width: 10px;
    height: 10px;
    background: var(--bg-panel);
    border-top: 1px solid var(--panel-border);
    border-right: 1px solid var(--panel-border);
    transform: rotate(45deg);
}

.titlebar {
    height: 34px;
    display: flex;
    align-items: center;
    gap: 9px;
}
.titlebar .t {
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.2px;
}

.divider { height: 1px; background: var(--divider); margin: 10px 0; }

.sechead {
    min-height: 18px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 8px;
}
.sechead .sl {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-2);
    line-height: 1.4;
    padding-top: 1px;
    white-space: nowrap;
}
.sechead .stack { text-align: right; }
.sechead .stack .a,
.sechead .stack .b {
    display: block;
    font-size: 11px;
    font-weight: 500;
    line-height: 1.4;
}
.sechead .stack .a { color: var(--text-2); }
.sechead .stack .b { color: var(--text-1); }

/* ═══ cards ══════════════════════════════════════════════════════════ */

.card {
    position: relative;
    height: 56px;
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 9px 12px;
    margin-bottom: 6px;
    background: var(--bg-card);
}
.card:hover { background: rgba(255, 255, 255, 0.07); }
.card:last-of-type { margin-bottom: 0; }

.card .fill {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 0%;
    transition: width .4s ease-out;
}
.card .fill.f-ok   { background: var(--fill-ok); }
.card .fill.f-warn { background: var(--fill-warn); }
.card .fill.f-crit { background: var(--fill-crit); }

.card .content {
    position: relative;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    width: 100%;
}
.card .left { min-width: 0; }
.card .l1 {
    font-size: 13px; font-weight: 500; color: var(--text-1);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.35;
}
.card .l2 {
    font-size: 11px; font-weight: 400; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.35;
}
.card .right { width: 76px; flex-shrink: 0; text-align: right; }
.card .metric {
    display: block;
    font-size: 16px; font-weight: 600; line-height: 1.25;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}
.card .metric .unit { font-size: 11px; font-weight: 500; opacity: 0.6; }
.card .sub {
    display: block;
    font-size: 11px; font-weight: 400; color: var(--text-2);
    line-height: 1.35; font-variant-numeric: tabular-nums;
    white-space: nowrap; margin-top: 1px;
}

.c-ok   { color: var(--ok); }
.c-warn { color: var(--warn); }
.c-crit { color: var(--crit); }
.c-idle { color: var(--idle); }
.card.dead .l1, .card.dead .l2 { color: var(--text-3); }

.more {
    min-height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-3);
    cursor: pointer;
    padding: 2px 0;
}
.more:hover { color: var(--text-1); }

.empty-note {
    min-height: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--text-3);
    padding: 6px 0;
}

/* ═══ hero ═══════════════════════════════════════════════════════════ */

.section-label {
    height: 18px;
    font-size: 11px; font-weight: 500; color: var(--text-2);
    margin-bottom: 6px;
}
.hero {
    min-height: 52px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}
.hero .left { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.hero .num {
    font-size: 34px; font-weight: 700; line-height: 1;
    letter-spacing: -0.5px; white-space: nowrap;
}
.hero .word { font-size: 14px; font-weight: 500; color: var(--text-3); }
.hero .stats {
    text-align: right;
    font-size: 12px; font-weight: 500; color: var(--text-2);
    line-height: 1.5; flex-shrink: 0;
    font-variant-numeric: tabular-nums;
}

/* ═══ footer meters ══════════════════════════════════════════════════ */

.meters { display: grid; grid-template-columns: 1fr 1fr 1fr; min-height: 58px; }
.meter { text-align: center; min-width: 0; }
.meter .n {
    font-size: 22px; font-weight: 700; line-height: 1.15;
    font-variant-numeric: tabular-nums;
}
.meter .l { font-size: 11px; font-weight: 500; color: var(--text-2); line-height: 1.3; }
.meter .s {
    font-size: 10px; font-weight: 400; color: var(--text-3); line-height: 1.3;
    font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.offline {
    padding: 40px 10px;
    text-align: center;
    color: var(--text-3);
    font-size: 12.5px;
    line-height: 1.6;
}
</style>
</head>
<body>

<div id="panelArea">
    <div id="panel"></div>
</div>

<div id="strip">
    <div id="bar">
        <div id="tiles"></div>
        <div class="bar-sep"></div>
        <div class="lockbtn" id="lockBtn" title="Lock position"></div>
    </div>
</div>

<script>
'use strict';
const invoke = window.__TAURI__.core.invoke;
const listen = window.__TAURI__.event.listen;
const POLL_MS = 5000;
const T_MAX = 85;
const STALE_MS = 45000;
const MAX_CARDS = 6;

/* PXI chassis mark — used for brand + hub tile (never a foreign glyph) */
const CHASSIS = (size) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24"
    fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
    <rect x="3" y="5" width="18" height="14" rx="2.6"/>
    <path d="M7.6 9.2v5.6M12 9.2v5.6M16.4 9.2v5.6"/></svg>`;
const PADLOCK = (locked) => locked
    ? `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>`
    : `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.7-1.5"/></svg>`;

const S = {
    up: false, locked: false, dragging: false,
    edges: [], devices: [], alerts: [], predictions: [],
    selected: null,
    showAll: false,
    expanded: false,
    winH: 336,          // last requested window height (logical px)
    tileY: 0,
    lastGeo: '',        // dedupe geometry IPC
};

/* ── helpers ── */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
    (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseTs(ts) {
    if (!ts) return null;
    let s = String(ts).trim().replace(' ', 'T');
    if (!/[zZ]$/.test(s) && !/[+-]\d{2}:?\d{2}$/.test(s)) s += 'Z';
    const t = Date.parse(s);
    return Number.isNaN(t) ? null : t;
}
function relTime(ts) {
    const t = parseTs(ts);
    if (t === null) return '';
    const s = Math.max(0, Math.round((Date.now() - t) / 1000));
    if (s < 60) return s + 's ago';
    const m = Math.floor(s / 60); if (m < 60) return m + 'm ago';
    const h = Math.floor(m / 60); if (h < 24) return h + 'h ago';
    return Math.floor(h / 24) + 'd ago';
}
function isStale(ts) {
    const t = parseTs(ts);
    return t === null ? true : Date.now() - t > STALE_MS;
}
function deviceTitle(id) {
    const i = id.indexOf(':');
    let short = i === -1 ? id : id.slice(i + 1);
    const h = short.lastIndexOf('#');
    return {
        name: (h === -1 ? short : short.slice(0, h)).trim(),
        tag: h === -1 ? '' : short.slice(h + 1),
    };
}
function sevClass(pct) {
    if (pct === null || pct === undefined) return 'idle';
    if (pct >= 85) return 'crit';
    if (pct >= 60) return 'warn';
    return 'ok';
}
const tempPct = (t) => (t === null || t === undefined)
    ? null : Math.max(0, Math.min(100, (t / T_MAX) * 100));
const initials = (name) =>
    (name.split(/\s+/).map((w) => w[0]).join('') || '?').slice(0, 2).toUpperCase();

/* ── geometry (window resize via Rust) ── */

/* measure the panel at its natural height, ignoring the window clamp */
function naturalPanelHeight() {
    const panel = document.getElementById('panel');
    const prev = panel.style.maxHeight;
    panel.style.maxHeight = 'none';
    const h = panel.offsetHeight;
    panel.style.maxHeight = prev;
    return h;
}

async function sendGeo(mode, h) {
    const key = mode + ':' + Math.round(h);
    if (key === S.lastGeo) {
        positionPanel();
        return;
    }
    S.lastGeo = key;
    try {
        const finalH = await invoke('update_geometry', { mode, height: h });
        S.winH = finalH;
        if (mode === 'panel') {
            document.getElementById('panel').style.maxHeight =
                (finalH - 16) + 'px';
        }
        positionPanel();
    } catch {}
}

async function setExpanded(on) {
    if (S.expanded === on) return;
    S.expanded = on;
    document.body.classList.toggle('expanded', on);
    if (on) {
        renderPanel();
        const bar = document.getElementById('bar');
        const h = Math.max(
            naturalPanelHeight() + 16,
            bar.getBoundingClientRect().height + 16);
        await sendGeo('panel', h);
    } else {
        const bar = document.getElementById('bar');
        await sendGeo('strip', bar.getBoundingClientRect().height + 16);
    }
}

/* ── strip / notch bar ── */
function tileSVG(pct, colorClass) {
    const stroke = pct === null ? 'var(--idle)'
        : colorClass === 'crit' ? 'var(--crit)'
        : colorClass === 'warn' ? 'var(--warn)' : 'var(--ok)';
    const offset = pct === null ? 40 : Math.max(0, 100 - pct);
    return `<svg class="ring" viewBox="0 0 40 40">
        <rect x="3" y="3" width="34" height="34" rx="11" fill="rgba(16,16,16,0.85)"
              stroke="rgba(255,255,255,0.08)" stroke-width="2.25"/>
        <rect class="ring-prog" x="3" y="3" width="34" height="34" rx="11" fill="none"
              stroke="${stroke}" stroke-width="2.25" stroke-linecap="round"
              pathLength="100" stroke-dasharray="100" stroke-dashoffset="${offset}"
              transform="rotate(-90 20 20)"/>
    </svg>`;
}

function renderStrip() {
    const el = document.getElementById('tiles');
    const bar = document.getElementById('bar');
    bar.classList.toggle('locked', S.locked);
    document.getElementById('lockBtn').innerHTML = PADLOCK(S.locked);

    const hub = `<div class="tile hub" data-edge="__hub">
        <div class="box">${tileSVG(100, S.up ? 'ok' : 'crit')}
            <span class="glyph">${CHASSIS(15)}</span></div>
    </div>`;

    const tiles = S.edges.map((e) => {
        const devs = S.devices.filter((d) => d.device_id.startsWith(e.edge_id + ':'));
        const temps = devs.map((d) => d.metrics?.temperature)
            .filter((t) => typeof t === 'number');
        const hot = temps.length ? Math.max(...temps) : null;
        const pct = tempPct(hot);
        const cls = sevClass(pct);
        const color = cls === 'crit' ? 'var(--crit)' : cls === 'warn' ? 'var(--warn)' : 'var(--ok)';
        return `<div class="tile" data-edge="${esc(e.edge_id)}" title="${esc(e.name)} — ${devs.length} devices">
            <div class="box">${tileSVG(pct, cls)}
                <span class="glyph txt">${esc(initials(e.name))}</span></div>
            <span class="pct" style="${pct === null ? '' : `color:${color}`}">
                ${pct === null ? '—' : Math.round(pct) + '%'}</span>
        </div>`;
    }).join('');

    el.innerHTML = hub + tiles;

    el.querySelectorAll('.tile').forEach((node) => {
        node.addEventListener('pointerenter', () => {
            if (S.dragging) return;
            const id = node.dataset.edge;
            const rect = node.getBoundingClientRect();
            S.tileY = rect.top + rect.height / 2;
            select(id === '__hub' ? null : id);
        });
    });

    if (!S.expanded) {
        sendGeo('strip', bar.getBoundingClientRect().height + 16);
    }
}

function select(id) {
    if (S.selected !== id) S.showAll = false;
    S.selected = id;
    renderPanel();
    setExpanded(true);
}

/* ── panel ── */
function cardHTML(d) {
    const reachable = d.metrics?.is_reachable !== false;
    const temp = typeof d.metrics?.temperature === 'number'
        ? d.metrics.temperature : null;
    const pct = tempPct(temp);
    const cls = sevClass(pct);
    const { name, tag } = deviceTitle(d.device_id);
    const edgeId = d.device_id.slice(0, d.device_id.indexOf(':')) || '';
    const edge = S.edges.find((e) => e.edge_id === edgeId);

    const l1 = `${name}${tag ? ' · #' + tag : ''}`;
    const l2 = reachable
        ? `${edge ? edge.name : edgeId} · link ok · ${relTime(d.last_seen)}`
        : `${edge ? edge.name : edgeId} · no link`;

    const dead = !reachable || temp === null;
    const metric = dead
        ? `<span class="metric c-idle">—</span>`
        : `<span class="metric c-${cls}">${temp.toFixed(1)}<span class="unit">°C</span></span>`;
    const sub = dead
        ? `<span class="sub">no data</span>`
        : `<span class="sub">${Math.round(T_MAX - temp)}° headroom</span>`;

    return `<div class="card ${dead ? 'dead' : ''}">
        <div class="fill f-${cls}" style="width:${dead ? 0 : pct}%"></div>
        <div class="content">
            <div class="left">
                <div class="l1">${esc(l1)}</div>
                <div class="l2">${esc(l2)}</div>
            </div>
            <div class="right">${metric}${sub}</div>
        </div>
    </div>`;
}

function renderPanel() {
    const el = document.getElementById('panel');
    if (!S.up) {
        el.innerHTML = `<div class="titlebar">${CHASSIS(20)}<span class="t">PXI Monitor</span></div>
            <div class="divider"></div>
            <div class="offline">Hub unreachable.<br>Retrying every 5 s…</div>`;
        positionPanel();
        return;
    }

    const id = S.selected;
    const edge = id ? S.edges.find((e) => e.edge_id === id) : null;
    const devs = id
        ? S.devices.filter((d) => d.device_id.startsWith(id + ':'))
        : S.devices;
    const alerts = S.alerts;
    const preds = S.predictions.filter((p) => (p.probability ?? 0) >= 0.8);

    const sorted = [...devs].sort((a, b) => {
        const pa = tempPct(a.metrics?.temperature ?? null) ?? -1;
        const pb = tempPct(b.metrics?.temperature ?? null) ?? -1;
        if (pb !== pa) return pb - pa;
        return a.device_id.localeCompare(b.device_id);
    });
    const overflow = sorted.length - MAX_CARDS;
    const shown = S.showAll ? sorted : sorted.slice(0, MAX_CARDS);

    const cards = shown.map(cardHTML).join('') +
        (overflow > 0
            ? `<div class="more" role="button">${S.showAll ? 'show less' : `+${overflow} more`}</div>`
            : '');

    const active = devs.filter((d) =>
        ['healthy', 'warning'].includes((d.status || '').toLowerCase())).length;
    const head = `<div class="sechead">
        <span class="sl">Modules</span>
        <span class="stack">
            <span class="a">${esc(edge ? edge.name : 'All edges')} · ${devs.length} device${devs.length === 1 ? '' : 's'}</span><br>
            <span class="b">${active} active</span>
        </span>
    </div>`;

    const temps = devs.map((d) => d.metrics?.temperature)
        .filter((t) => typeof t === 'number');
    const peak = temps.length ? Math.max(...temps) : null;
    const crit = alerts.filter((a) => (a.severity || '').toLowerCase() === 'critical').length;
    const hero = `<div class="section-label">Today</div>
    <div class="hero">
        <div class="left">
            <span class="num">${peak !== null ? peak.toFixed(1) + '°' : '—'}</span>
            <span class="word">peak</span>
        </div>
        <div class="stats">
            ↓ ${alerts.length} alert${alerts.length === 1 ? '' : 's'}<br>
            ↑ ${preds.length} pred${preds.length === 1 ? '' : 's'}<br>
            ${S.devices.length} modules
        </div>
    </div>`;

    const online = S.devices.filter((d) =>
        ['healthy', 'warning'].includes((d.status || '').toLowerCase())).length;
    const onlinePct = S.devices.length ? Math.round((online / S.devices.length) * 100) : null;
    const fresh = S.devices.filter((d) => !isStale(d.last_seen)).length;
    const freshPct = S.devices.length ? Math.round((fresh / S.devices.length) * 100) : null;
    const meters = `<div class="divider"></div>
    <div class="meters">
        <div class="meter">
            <div class="n c-${sevClass(onlinePct === null ? null : 100 - onlinePct)}">${onlinePct ?? '—'}%</div>
            <div class="l">Online</div>
            <div class="s">${online} of ${S.devices.length}</div>
        </div>
        <div class="meter">
            <div class="n c-${sevClass(freshPct === null ? null : 100 - freshPct)}">${freshPct ?? '—'}%</div>
            <div class="l">Fresh</div>
            <div class="s">${fresh} reporting</div>
        </div>
        <div class="meter">
            <div class="n c-${alerts.length === 0 ? 'ok' : crit > 0 ? 'crit' : 'warn'}">${alerts.length}</div>
            <div class="l">Alerts</div>
            <div class="s">${crit} critical</div>
        </div>
    </div>`;

    el.innerHTML = `
        <div class="titlebar">${CHASSIS(20)}<span class="t">PXI Monitor</span></div>
        <div class="divider"></div>
        ${head}
        <div class="cards">${cards || '<div class="empty-note">no populated slots</div>'}</div>
        <div class="divider"></div>
        ${hero}
        ${meters}`;

    positionPanel();

    /* keep the window matched to content while open */
    if (S.expanded) {
        const bar = document.getElementById('bar');
        const h = Math.max(
            naturalPanelHeight() + 16,
            bar.getBoundingClientRect().height + 16);
        sendGeo('panel', h); /* deduped via lastGeo */
    }
}

/* center the panel on the bar / hovered tile; clamp to the window */
function positionPanel() {
    const panel = document.getElementById('panel');
    const bar = document.getElementById('bar');
    if (!panel || !bar) return;
    const ph = panel.offsetHeight;
    const barRect = bar.getBoundingClientRect();
    const barCenter = barRect.top + barRect.height / 2;
    const top = Math.max(8, Math.min(S.winH - ph - 8, barCenter - ph / 2));
    panel.style.top = top + 'px';
    panel.style.setProperty('--notch-y',
        Math.max(14, Math.min(ph - 14, S.tileY - top - 5)) + 'px');
}

/* ── polling ── */
async function poll() {
    let data;
    try { data = await invoke('poll'); } catch { data = { up: false }; }
    S.up = !!data.up;
    if (S.up) {
        S.edges = data.edges || [];
        S.devices = data.devices || [];
        S.alerts = data.alerts || [];
        S.predictions = data.predictions || [];
    }
    renderStrip();
    renderPanel();
}

/* ── drag + lock wiring ── */
function initDrag() {
    const bar = document.getElementById('bar');

    bar.addEventListener('pointerdown', (e) => {
        if (S.locked) return;
        if (e.target.closest('.tile') || e.target.closest('.lockbtn')) return;
        S.dragging = true;
        bar.classList.add('dragging');
        bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener('pointermove', (e) => {
        if (!S.dragging) return;
        invoke('move_by', { dx: e.movementX, dy: e.movementY });
    });
    const end = (e) => {
        if (!S.dragging) return;
        S.dragging = false;
        bar.classList.remove('dragging');
        bar.releasePointerCapture(e.pointerId);
        invoke('save_state');
    };
    bar.addEventListener('pointerup', end);
    bar.addEventListener('pointercancel', end);

    document.getElementById('lockBtn').addEventListener('click', (e) => {
        e.stopPropagation();
        invoke('set_locked', { locked: !S.locked });
    });

    /* "+N more" / "show less" toggle */
    document.getElementById('panel').addEventListener('click', (e) => {
        if (e.target.closest('.more')) {
            S.showAll = !S.showAll;
            renderPanel();
        }
    });

    document.addEventListener('mouseleave', () => {
        if (!S.dragging) setExpanded(false);
    });
}

/* ── boot ── */
async function init() {
    initDrag();
    try {
        const state = await invoke('get_state');
        S.locked = !!state.locked;
    } catch {}
    listen('lock-changed', (e) => { S.locked = !!e.payload; renderStrip(); });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') setExpanded(false);
    });

    await poll();
    setInterval(poll, POLL_MS);
}

init();
</script>
