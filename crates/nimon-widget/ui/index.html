<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>NIMon Widget</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="panelArea">
    <section id="panel" aria-label="PXI Monitor details" inert>
        <div class="titlebar">
            <span class="brand" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2.6"/><path d="M7.6 9.2v5.6M12 9.2v5.6M16.4 9.2v5.6"/></svg></span>
            <span class="t">PXI Monitor</span>
            <span id="headline" class="badge b-idle" role="status">—</span>
            <span class="spacer"></span>
            <button type="button" id="dashBtn" class="iconbtn" aria-label="Open dashboard in browser" title="Open dashboard">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
            </button>
            <button type="button" id="closeBtn" class="iconbtn" aria-label="Collapse panel (Esc)" title="Collapse (Esc)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>
        <div class="statusline"><span id="scopeLine"></span><span id="updated"></span></div>
        <div id="notice" class="notice" role="status" hidden></div>
        <div class="divider"></div>

        <div class="sechead">
            <span class="sl">Modules</span>
            <span class="stack"><span class="a" id="modA"></span><span class="b" id="modB"></span></span>
        </div>
        <div class="cards" id="cardsScroll"><div id="cardList" role="list" aria-label="Modules"></div></div>
        <div id="cardsEmpty" class="empty-note" hidden>no populated slots</div>
        <button type="button" id="moreBtn" class="more" hidden></button>

        <div class="divider"></div>
        <div class="sechead">
            <span class="sl">Active alerts</span>
            <span class="stack"><span class="a" id="alertHead"></span></span>
        </div>
        <div id="alertList" role="list" aria-label="Active alerts"></div>
        <div id="alertsEmpty" class="empty-note" hidden>No active alerts</div>
        <button type="button" id="alertsMore" class="more" hidden></button>

        <div class="divider"></div>
        <div class="section-label">Now</div>
        <div class="hero">
            <div class="left">
                <span class="num" id="peakNum">—</span>
                <span class="word">peak now</span>
            </div>
            <div class="stats">
                <span id="stAlerts"></span><br>
                <span id="stPreds"></span><br>
                <span id="stMods"></span>
            </div>
        </div>

        <div id="stationSec" hidden>
            <div class="section-label">Station</div>
            <div class="hero">
                <div class="left">
                    <span class="num" id="memFree">—</span>
                    <span class="word">RAM free</span>
                </div>
                <div class="stats">
                    <span id="memLine"></span><br>
                    <span id="diskLine"></span><br>
                    <span id="stationName"></span>
                </div>
            </div>
        </div>

        <div class="divider"></div>
        <div class="meters">
            <div class="meter">
                <div class="n" id="mOnlineN">—</div>
                <div class="l">Online</div>
                <div class="s" id="mOnlineS"></div>
            </div>
            <div class="meter">
                <div class="n" id="mFreshN">—</div>
                <div class="l">Fresh</div>
                <div class="s" id="mFreshS"></div>
            </div>
            <div class="meter">
                <div class="n" id="mAlertsN">—</div>
                <div class="l">Alerts</div>
                <div class="s" id="mAlertsS"></div>
            </div>
        </div>
    </section>
</div>

<div id="strip">
    <div id="bar">
        <button type="button" class="tile hub" id="hubTile" data-edge="__hub" aria-label="NIMon hub">
            <span class="box">
                <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
                    <rect class="ring-bg" x="3" y="3" width="34" height="34" rx="11"/>
                    <rect class="ring-prog" x="3" y="3" width="34" height="34" rx="11" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0" transform="rotate(-90 20 20)"/>
                </svg>
                <span class="glyph" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2.6"/><path d="M7.6 9.2v5.6M12 9.2v5.6M16.4 9.2v5.6"/></svg></span>
                <span class="flag" aria-hidden="true"></span>
            </span>
            <span class="pct" aria-hidden="true">HUB</span>
        </button>
        <div id="tiles"></div>
        <div class="bar-sep"></div>
        <button type="button" class="lockbtn" id="lockBtn" aria-pressed="false" aria-label="Lock position" title="Lock position">
            <svg class="pad-open" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.7-1.5"/></svg>
            <svg class="pad-closed" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        </button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
